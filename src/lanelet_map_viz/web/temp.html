<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Lanelet Map Viewer</title>
    <style>
        html, body { 
            margin: 0;
            padding: 0;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
        } 
        #logo {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 5px;
        }
        
        #logo img {
            height: 50px;
        }
        
        #title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 5px;
        }

        #map, #three-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        #three-container {
            display: none;
        }
    </style>


    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@v0.149.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.149.0/examples/jsm/"
        }
    }
    </script>
    
    <script>   
        const PORT = 40957;
    </script>
</head>
<body>
    <button id="toggleView" style="position:absolute; top:10px; right:10px; z-index:20;">Switch to 3D</button>
    <canvas id="map"></canvas>
    <div id = "three-container"></div>
    <script type="module" src="/main.js"></script>
    </body>
</html>
