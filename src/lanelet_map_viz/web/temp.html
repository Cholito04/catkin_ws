<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Lanelet Map Viewer</title>
    <style>
        html, body { 
            margin: 0;
            padding: 0;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
        } 
        #logo {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 5px;
        }
        
        #logo img {
            height: 50px;
        }
        
        #title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 5px;
        }

        #map, #three-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        #three-container {
            display: none;
        }
    </style>


    <script type="importmap">
    {
        "imports": {
            "three": "./libs/three/three.module.js",
            "three/addons/": "./libs/three/examples/jsm/"
        }
    }
    </script>
    
    <script>   
        const PORT = 51731;
    </script>
</head>
<body>
    <button id="toggleView" style="position:absolute; top:10px; left:10px; z-index:20;">Switch to 3D</button>
    <canvas id="map"></canvas>
    <div id="three-container"></div>

    <div id="stop-controls" style="position:absolute; top:50px; right:10px;
        background:rgba(0,0,0,0.7); padding:12px; border-radius:8px; color:#fff; z-index:10;">
        <div id="stopCount" style="font-size:10px; color:#aaa; margin-bottom:6px;">Stops: loading...</div>
        <label>Start</label><br>
        <select id="startSelect" style="width:160px; margin-bottom:8px;"></select><br>
        <label>Goal</label><br>
        <select id="goalSelect" style="width:160px; margin-bottom:8px;"></select><br>
        <button id="computeRoute" style="width:160px;">Compute Route</button>
    </div>


    <script type="module" src="/main.js"></script>
</body>
</html>
